{
  "services": {
    "mysql-service": {
      "image": "mysql:8.4",
      "environment": {
        "MYSQL_DATABASE": "blogdb",
        "MYSQL_USER": "bloguser",
        "MYSQL_PASSWORD": "${DB_PASSWORD:?Set DB_PASSWORD}",
        "MYSQL_ROOT_PASSWORD": "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}"
      },
      "volumes": [
        "mysql-data:/var/lib/mysql",
        "./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" -e \"SELECT 1\" \"$$MYSQL_DATABASE\""
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 40,
        "start_period": "30s"
      }
    },
    "backend-service": {
      "build": "./backend",
      "environment": {
        "DB_HOST": "mysql-service",
        "DB_USER": "bloguser",
        "DB_NAME": "blogdb",
        "DB_PASSWORD": "${DB_PASSWORD:?Set DB_PASSWORD}",
        "JWT_SECRET": "${JWT_SECRET:?Set JWT_SECRET}",
        "CORS_ORIGIN": "http://localhost:3000"
      },
      "depends_on": {
        "mysql-service": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 20
      }
    },
    "frontend": {
      "build": "./frontend",
      "ports": [
        "127.0.0.1:3000:8080"
      ],
      "depends_on": {
        "backend-service": {
          "condition": "service_healthy"
        }
      }
    }
  },
  "volumes": {
    "mysql-data": {}
  }
}
